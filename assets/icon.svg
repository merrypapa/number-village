<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Inruha World 대표 아이콘 — 하늘 · 무지개 · 분홍 성 · 숫자 블록 1 · 하트 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="512" height="512" rx="110"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- 무지개 -->
    <g fill="none" stroke-width="22" opacity="0.95">
      <path d="M40 300 A216 216 0 0 1 472 300" stroke="#ff7a9c"/>
      <path d="M62 300 A194 194 0 0 1 450 300" stroke="#ffb347"/>
      <path d="M84 300 A172 172 0 0 1 428 300" stroke="#ffe066"/>
      <path d="M106 300 A150 150 0 0 1 406 300" stroke="#7ad48f"/>
      <path d="M128 300 A128 128 0 0 1 384 300" stroke="#7ad4ff"/>
    </g>
    <!-- 구름 -->
    <g fill="#fff"><circle cx="90" cy="120" r="26"/><circle cx="120" cy="108" r="32"/><circle cx="150" cy="122" r="24"/>
      <circle cx="400" cy="90" r="22"/><circle cx="426" cy="80" r="28"/><circle cx="452" cy="92" r="20"/></g>
    <!-- 잔디 -->
    <rect y="360" width="512" height="152" fill="#9fe08a"/>
    <!-- 성 -->
    <rect x="166" y="220" width="180" height="150" fill="#ffd0e6"/>
    <rect x="146" y="180" width="52" height="190" fill="#ff9ec4"/>
    <rect x="314" y="180" width="52" height="190" fill="#ff9ec4"/>
    <rect x="226" y="150" width="60" height="220" fill="#ff9ec4"/>
    <polygon points="140,184 172,120 204,184" fill="#c9b4ff"/>
    <polygon points="308,184 340,120 372,184" fill="#c9b4ff"/>
    <polygon points="220,154 256,80 292,154" fill="#c9b4ff"/>
    <rect x="254" y="60" width="4" height="30" fill="#7a4fb0"/><polygon points="258,60 290,70 258,80" fill="#ffd93d"/>
    <rect x="236" y="300" width="40" height="70" rx="20" fill="#7a4fb0"/>
    <rect x="182" y="250" width="22" height="30" rx="4" fill="#fff6e8"/><rect x="306" y="250" width="22" height="30" rx="4" fill="#fff6e8"/>
    <!-- 숫자 블록 1 (눈 하나) -->
    <rect x="72" y="300" width="72" height="72" rx="6" fill="#e8412c" stroke="#2a2233" stroke-width="4"/>
    <circle cx="108" cy="328" r="14" fill="#fff"/><circle cx="108" cy="330" r="7" fill="#1b1430"/>
    <path d="M92 350 Q108 364 124 350" stroke="#1b1430" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 하트 -->
    <path d="M400 330 c-14-24-48-12-40 14 6 20 40 40 40 40 s34-20 40-40 c8-26-26-38-40-14z" fill="#ff5a8a" stroke="#fff" stroke-width="6"/>
    <!-- 이름 띠 -->
    <rect y="416" width="512" height="96" fill="#7a4fb0" opacity="0.9"/>
    <text x="256" y="480" text-anchor="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="66" font-weight="900" fill="#fff">Inruha World</text>
  </g>
</svg>
