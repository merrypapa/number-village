<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>숫자마을 대모험</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#bfe8ff;
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    /* 손가락으로 밀어도 화면이 스크롤되거나 확대되지 않게 (아이폰·아이패드) */
    touch-action:none; overscroll-behavior:none; position:fixed; inset:0; }
  canvas { display:block; }

  /* ---- 화면(스크린) 공통 ---- */
  .screen { position:fixed; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:10; }
  .screen.on { display:flex; }

  /* ---- 친구 고르기: 격자 ---- */
  #pick, #preview { background:linear-gradient(180deg,#cbeaff 0%,#ffe8f4 100%); }
  #pick { justify-content:flex-start; padding:calc(12px + env(safe-area-inset-top)) 10px
          calc(12px + env(safe-area-inset-bottom)); }
  #pick h1, #preview h1 { font-size:clamp(24px,5.5vw,46px); color:#5b3d8f;
    margin:6px 0 12px; text-shadow:0 3px 0 #fff; flex:none; }

  #grid { width:100%; max-width:900px; flex:1; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; touch-action:pan-y;
    display:grid; gap:10px; padding:4px 6px 16px;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); }
  /* 카드 = 가로:세로 3:4 칸.
     padding-top(가로 폭의 133%)으로 높이를 만든다. 격자 칸 높이와 정확히 맞아떨어진다.
     (aspect-ratio는 격자 안에서 행 높이 계산이 어긋나는 경우가 있어 이 방식을 쓴다) */
  .card { position:relative; display:block; border:none; cursor:pointer; align-self:start;
    width:100%; height:0; padding:133.33% 0 0;
    background:var(--tint,#fff); border-radius:18px; overflow:hidden;
    box-shadow:0 4px 0 #00000018; }
  .card:active { transform:translateY(3px); box-shadow:0 1px 0 #00000018; }
  .card img, .card .letter { position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; }
  .card .letter { display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:#ffffffcc; }
  /* 이름표는 사진 위에 겹쳐 놓는다 */
  .cardName { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:6px 4px 7px;
    background:linear-gradient(#0000, #000000b8 55%);
    color:#fff; font-size:14px; font-weight:800; text-shadow:0 1px 3px #000a;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ---- 친구 고르기: 크게 보기 ---- */
  #back { position:absolute; left:calc(14px + env(safe-area-inset-left));
    top:calc(14px + env(safe-area-inset-top)); border:none; border-radius:999px;
    padding:12px 22px; background:#fff; color:#7a4fb0; font-size:19px; font-weight:800;
    box-shadow:0 5px 0 #d8bfe8; cursor:pointer; }
  #back:active { transform:translateY(3px); box-shadow:0 2px 0 #d8bfe8; }

  #charName { font-size:clamp(24px,5vw,40px); color:#e0518f; font-weight:800; margin:10px 0; }
  #charStage { width:min(80vw,420px); height:min(45vh,360px); }
  .row { display:flex; align-items:center; gap:20px; }
  .arrow { width:72px; height:72px; border:none; border-radius:50%; background:#fff;
    box-shadow:0 6px 0 #d8bfe8; font-size:36px; color:#7a4fb0; cursor:pointer; }
  .arrow:active { transform:translateY(4px); box-shadow:0 2px 0 #d8bfe8; }
  #playBtn { margin-top:22px; padding:18px 46px; border:none; border-radius:999px;
    background:#ff8fc0; color:#fff; font-size:clamp(20px,4vw,30px); font-weight:800;
    box-shadow:0 8px 0 #e0518f; cursor:pointer; }
  #playBtn:active { transform:translateY(5px); box-shadow:0 3px 0 #e0518f; }

  /* ---- 게임 중 HUD ---- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
  #hud.on { display:block; }
  #bookBtn { position:absolute; top:16px; right:16px; width:64px; height:64px;
    border:none; border-radius:20px; background:#fff9; font-size:32px;
    pointer-events:auto; cursor:pointer; }
  /* ---- 오른쪽 버튼 (인사 · 점프 · 타기) ---- */
  #hi, #jump, #ride { position:absolute; border:none; border-radius:50%; color:#fff;
    pointer-events:auto; cursor:pointer; touch-action:none;
    display:flex; align-items:center; justify-content:center; }
  #hi   { right:calc(24px + env(safe-area-inset-right));
          bottom:calc(28px + env(safe-area-inset-bottom));
          width:104px; height:104px; font-size:44px;
          background:#ff8fc0; box-shadow:0 6px 0 #e0518f; }
  #jump { right:calc(28px + env(safe-area-inset-right));
          bottom:calc(150px + env(safe-area-inset-bottom));
          width:96px; height:96px; font-size:34px; font-weight:800;
          background:#7ad4ff; box-shadow:0 6px 0 #3aa9e0; }
  /* 타기 버튼은 그네·미끄럼틀 옆에 갔을 때만 나타난다 (main.js가 보여준다) */
  #ride { right:calc(30px + env(safe-area-inset-right));
          bottom:calc(262px + env(safe-area-inset-bottom));
          width:92px; height:92px; font-size:24px; font-weight:800;
          background:#ffd93d; color:#7a4a00; box-shadow:0 6px 0 #d9a800;
          display:none; }
  #hi:active   { transform:translateY(4px); box-shadow:0 2px 0 #e0518f; }
  #jump:active { transform:translateY(4px); box-shadow:0 2px 0 #3aa9e0; }
  #ride:active { transform:translateY(4px); box-shadow:0 2px 0 #d9a800; }

  /* ---- 왼쪽 가상 조이스틱 ---- */
  #stick { position:absolute; left:calc(26px + env(safe-area-inset-left));
    bottom:calc(30px + env(safe-area-inset-bottom));
    width:154px; height:154px; border-radius:50%;
    background:#ffffff4d; border:4px solid #ffffff99;
    pointer-events:auto; touch-action:none;
    display:flex; align-items:center; justify-content:center; }
  #knob { width:70px; height:70px; border-radius:50%; background:#ff8fc0;
    box-shadow:0 4px 0 #e0518f; pointer-events:none;
    transition:transform .06s linear; }

  /* 화면이 작으면 조작부를 조금 줄인다 */
  @media (max-height:430px), (max-width:400px) {
    #stick { width:126px; height:126px; }
    #knob  { width:58px; height:58px; }
    #hi    { width:84px;  height:84px;  font-size:36px; }
    #jump  { width:78px;  height:78px;  font-size:28px;
             bottom:calc(124px + env(safe-area-inset-bottom)); }
    #ride  { width:74px;  height:74px;  font-size:20px;
             bottom:calc(212px + env(safe-area-inset-bottom)); }
  }
  /* 공간이 바뀔 때 화면을 잠깐 덮는 막 (성에 들어가고 나올 때) */
  #fade { position:fixed; inset:0; z-index:30; background:#fff;
    opacity:0; pointer-events:none; transition:opacity .3s ease; }
  #fade.on { opacity:1; }
  #toast { position:absolute; left:50%; top:18%; transform:translateX(-50%);
    background:#fff; color:#5b3d8f; font-size:28px; font-weight:800;
    padding:14px 28px; border-radius:24px; box-shadow:0 6px 18px #0003;
    opacity:0; transition:opacity .3s; }
  #toast.on { opacity:1; }
  /* 안내문 — 조작부 위에 두고, 8초 뒤 스르륵 사라진다 */
  #hint { position:absolute; left:50%; bottom:calc(196px + env(safe-area-inset-bottom));
    transform:translateX(-50%); width:max-content; max-width:86vw; text-align:center;
    color:#fff; font-size:15px; line-height:1.4; text-shadow:0 1px 4px #0008;
    pointer-events:none; opacity:1; transition:opacity 1.2s ease 8s; }
  #hud.on #hint { opacity:0; }

  /* 좁은 화면(폰 세로)에서는 무대와 화살표를 줄여서 화면 안에 넣는다 */
  @media (max-width:520px) {
    .row { gap:8px; }
    .arrow { width:58px; height:58px; font-size:28px; }
    #charStage { width:min(58vw,420px); height:min(42vh,360px); }
    #back { padding:10px 18px; font-size:17px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- 1) 친구 고르기 — 한 번에 쭉 보여주는 격자 -->
<div id="pick" class="screen on">
  <h1>누구랑 놀까?</h1>
  <div id="grid"></div>
</div>

<!-- 2) 고른 친구 크게 보기 -->
<div id="preview" class="screen">
  <button id="back">◀ 뒤로</button>
  <div class="row">
    <button class="arrow" id="prev">◀</button>
    <canvas id="charStage"></canvas>
    <button class="arrow" id="next">▶</button>
  </div>
  <div id="charName">하나</div>
  <button id="playBtn">이 친구로 놀기!</button>
</div>

<!-- 게임 HUD -->
<div id="hud">
  <button id="bookBtn">📖</button>

  <!-- 왼쪽: 손가락으로 미는 조이스틱 -->
  <div id="stick" class="no-drag"><div id="knob"></div></div>

  <!-- 오른쪽: 타기(놀이기구 옆에서만) · 점프 · 인사 -->
  <button id="ride" class="no-drag">타기</button>
  <button id="jump" class="no-drag">점프</button>
  <button id="hi" class="no-drag">👋</button>

  <div id="toast"></div>
  <div id="hint">동그라미를 밀어서 걷고<br>점프·👋 버튼을 눌러요<br>놀이터에서 그네·미끄럼틀·시소도 타요!<br>🏰 성 안에 들어가면 요정 친구를 부를 수 있어요</div>
</div>

<!-- 공간이 바뀔 때 화면을 덮는 막 -->
<div id="fade"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
